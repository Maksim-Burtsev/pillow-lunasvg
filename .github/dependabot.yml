version: 2
updates:
  # Action pins in .github/workflows/wheels.yml. Grouped so a week's worth of
  # bumps arrives as one PR instead of five.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # The vendored lunasvg in third_party/. Monthly: every bump costs a full
  # cibuildwheel matrix, and the pin needs the pixel-parity check run by hand
  # before it can be merged.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "build"
